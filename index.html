<body>
  <a href="#page-content" class="skip-link">Skip to main content</a>

  <div id="app" role="application" aria-label="Project HUNAR Application">
    <div class="hunar-loading-shell">
      <div class="brand-row">
        <div class="brand-icon">H</div>
        <div class="brand-copy">
          <span class="eyebrow">PROJECT HUNAR</span>
          <h1>Beyond Marks. Beyond Barriers.</h1>
        </div>
      </div>

      <div class="loading-card">
        <div class="loading-visual">
          <div class="orb orb-one"></div>
          <div class="orb orb-two"></div>
          <div class="pulse-ring"></div>
        </div>

        <div class="loading-content">
          <p class="status-label">Skill discovery studio</p>
          <h2>Preparing your learning dashboard</h2>
          <p class="status-copy">Curating challenges, achievements, and evidence-backed portfolios for real-world growth.</p>
        </div>

        <div class="status-row">
          <span class="status-dot"></span>
          <span id="clerk-status">Loading...</span>
        </div>
      </div>

      <div class="cta-row">
        <button id="btn-signin" class="btn btn-primary btn-lg">Sign In</button>
        <button id="btn-signup" class="btn btn-secondary btn-lg">Sign Up</button>
        <button id="btn-learning" class="btn btn-ghost btn-lg">Explore Learning</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="modal-overlay" aria-hidden="true"></div>
  <div class="toast-container" id="toast-container" aria-live="polite" aria-atomic="true"></div>
